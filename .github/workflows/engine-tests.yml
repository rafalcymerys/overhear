name: Engine tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast lane (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: Engine/requirements-test.txt

      - name: Install dependencies
        run: pip install -r Engine/requirements-test.txt

      - name: Run engine tests
        run: pytest Engine -q

  real-models:
    name: Real models (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Engine/requirements-dev.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-faster-whisper-base

      - name: Install dependencies
        run: pip install -r Engine/requirements-dev.txt

      - name: Run engine tests with real models
        run: pytest Engine -q --run-slow
